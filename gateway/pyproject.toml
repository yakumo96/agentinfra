[project]
name = "agentinfra-gateway"
version = "0.1.0"
description = "gatewayd: model routing, budgets, context protection and compression (absorbs Headroom)"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
gatewayd = "agentinfra_gateway.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentinfra_gateway"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
