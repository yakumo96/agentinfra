[package]
name = "infra-bridge"
description = "Authenticated bounded duplex channels for cluster-two runtime integration"
version.workspace = true
edition = "2021"
rust-version = "1.85"
license.workspace = true

[features]
default = ["duplex"]
duplex = ["dep:snow"]

[dependencies]
infra-content = { path = "../content" }
infra-history = { path = "../history" }
snow = { version = "=0.9.6", optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(chacha20_force_neon)',
    'cfg(aes_armv8)',
    'cfg(polyval_armv8)',
] }
