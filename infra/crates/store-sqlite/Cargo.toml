[package]
name = "infra-store-sqlite"
description = "Shared physical persistence and history over durable embedded SQLite."
version.workspace = true
edition = "2021"
rust-version = "1.85"
license.workspace = true

[dependencies]
infra-store = { path = "../store" }
infra-history = { path = "../history", default-features = false }
infra-content = { path = "../content" }
infra-telemetry = { path = "../telemetry" }
rusqlite = { version = "=0.40.2", features = ["cache", "limits", "blob"] }

[dev-dependencies]
blake3 = { version = "=1.8.5", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["fs"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["fs", "pthread", "signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
