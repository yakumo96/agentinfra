[package]
name = "infra-testkit-sdk"
description = "The SDK's public surface behind the JavaScript SDK, one function per method: project Init and Branches, fs and branch Store methods over infra-version, and Sandbox control"
version.workspace = true
edition = "2021"
rust-version = "1.85"
license.workspace = true

[dependencies]
infra-bridge = { path = "../bridge" }
infra-content = { path = "../content" }
infra-history = { path = "../history" }
infra-store-sqlite = { path = "../store-sqlite" }
infra-store = { path = "../store" }
infra-telemetry = { path = "../telemetry" }
infra-repo-init = { path = "../repo-init" }
infra-testkit-docker = { path = "../testkit-docker" }
infra-version = { path = "../version" }

[dev-dependencies]
# #364: the write-cost harness times BLAKE3 over the bytes it writes.
blake3 = { version = "=1.8.5", default-features = false }
# The Store method tests bind private Workspaces and count the Store's rows.
infra-overlay = { path = "../overlay" }
infra-workspace = { path = "../workspace" }
rusqlite = { version = "=0.40.2", features = ["cache", "limits", "blob"] }
